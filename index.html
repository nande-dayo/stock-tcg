<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東証ポケカ：厳選60社決算バトルスタジアム</title>
<style>
  :root {
    --bg-dark: #080c14;
    --panel-bg: #101624;
    --text-main: #f8fafc;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 25px;
    letter-spacing: 1px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.subtitle {
    color: #94a3b8;
    font-size: 13px;
  }

  /* セレクターパネル */
  .matchup-bar {
    background: var(--panel-bg);
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 10px 18px;
    max-width: 1040px;
    width: 100%;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }

  .select-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .select-group label {
    font-size: 11px;
    font-weight: bold;
    color: #94a3b8;
  }

  select {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #475569;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: bold;
    cursor: pointer;
    min-width: 240px;
  }

  select:focus {
    outline: none;
    border-color: #38bdf8;
  }

  .btn-random {
    background: #334155;
    color: #cbd5e1;
    border: 1px solid #475569;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-random:hover {
    background: #475569;
    color: white;
  }

  /* バトルアリーナ */
  .arena {
    background: var(--panel-bg);
    border: 2px solid #334155;
    border-radius: 18px;
    max-width: 1040px;
    width: 100%;
    padding: 16px 20px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* 巨大アナウンスティッカー */
  .cutin-banner {
    width: 100%;
    min-height: 86px;
    background: linear-gradient(90deg, rgba(15,23,42,0.96), rgba(30,41,59,0.98), rgba(15,23,42,0.96));
    border: 2px solid #38bdf8;
    border-radius: 12px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 18px;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    transition: all 0.3s ease;
  }

  .cutin-top {
    font-size: 21px;
    font-weight: 900;
    color: #f59e0b;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    margin-bottom: 5px;
  }

  .cutin-bottom {
    font-size: 15px;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    width: 100%;
  }

  .cutin-bottom .dmg-highlight {
    color: #ef4444;
    font-size: 18px;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    margin: 0 3px;
  }

  .cutin-bottom .buff-highlight {
    color: #22c55e;
    font-size: 18px;
    font-weight: 900;
    text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
    margin: 0 3px;
  }

  .cutin-bottom .note-highlight {
    font-size: 13px;
    color: #94a3b8;
    font-weight: normal;
    margin-left: 6px;
  }

  /* 改行された朝刊ニュース行 */
  .cutin-news-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    margin-top: 4px;
  }

  .cutin-news-row {
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14.5px;
    line-height: 1.4;
    flex-wrap: wrap;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .cutin-news-row.damage-row {
    border-color: rgba(239, 68, 68, 0.4);
    background: rgba(239, 68, 68, 0.08);
  }

  .cutin-news-row.buff-row {
    border-color: rgba(34, 197, 94, 0.4);
    background: rgba(34, 197, 94, 0.08);
  }

  .hp-overheal-badge {
    color: #38bdf8;
    font-size: 12px;
    font-weight: 900;
    margin-left: 4px;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
  }

  /* 操作コントロールバー（オート／手動送り） */
  .arena-controls {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .start-btn {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    font-size: 16px;
    font-weight: 900;
    padding: 11px 32px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    transition: all 0.2s;
  }

  .start-btn:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
  }

  .start-btn:disabled {
    background: #475569;
    cursor: not-allowed;
    box-shadow: none;
  }

  .ctrl-btn {
    background: #1e293b;
    border: 1px solid #475569;
    color: #f8fafc;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .ctrl-btn:hover:not(:disabled) {
    background: #334155;
    border-color: #38bdf8;
  }
  .ctrl-btn.active {
    background: #0284c7;
    border-color: #38bdf8;
    color: white;
  }
  .ctrl-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .battle-stage {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    gap: 20px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .vs-badge {
    font-size: 32px;
    font-weight: 900;
    font-style: italic;
    color: #f59e0b;
    text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
  }

  .fighter-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  /* HPバー */
  .hp-bar-container {
    width: 310px;
    background: #090d16;
    border: 2px solid #475569;
    border-radius: 10px;
    padding: 5px 12px;
  }

  .hp-bar-header {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: bold;
    margin-bottom: 3px;
  }

  .hp-progress {
    width: 100%;
    height: 15px;
    background: #1e293b;
    border-radius: 8px;
    overflow: hidden;
  }

  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    width: 100%;
    transition: width 0.5s ease;
  }

  .hp-fill.danger {
    background: linear-gradient(90deg, #ef4444, #b91c1c);
  }

  .hp-fill.overheal {
    background: linear-gradient(90deg, #10b981, #06b6d4 50%, #8b5cf6) !important;
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
  }

  /* 実況ログモニター（履歴） */
  .log-monitor {
    width: 100%;
    background: #080c14;
    border: 1px solid #1e293b;
    border-radius: 10px;
    height: 110px;
    padding: 10px 16px;
    overflow-y: auto;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    flex-direction: column-reverse;
  }

  .log-line {
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .log-event {
    color: #f59e0b;
    font-weight: bold;
  }
  .log-damage {
    color: #ef4444;
    font-weight: bold;
  }
  .log-buff {
    color: #22c55e;
    font-weight: bold;
  }

  /* カード本体 */
  .card {
    width: 310px;
    height: 450px;
    border-radius: 18px;
    padding: 10px;
    position: relative;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    transition: transform 0.2s;
    user-select: none;
    display: flex;
    flex-direction: column;
  }

  /* タイプ別外枠グラデーション */
  .card-steel {
    background: linear-gradient(135deg, #cbd5e1, #64748b 50%, #94a3b8);
    border: 2px solid #e2e8f0;
  }
  .card-lightning {
    background: linear-gradient(135deg, #fef08a, #ca8a04 50%, #eab308);
    border: 2px solid #fef9c3;
  }
  .card-psychic {
    background: linear-gradient(135deg, #f472b6, #9333ea 50%, #c084fc);
    border: 2px solid #fbcfe8;
  }
  .card-water {
    background: linear-gradient(135deg, #7dd3fc, #0284c7 50%, #38bdf8);
    border: 2px solid #bae6fd;
  }
  .card-grass {
    background: linear-gradient(135deg, #86efac, #16a34a 50%, #4ade80);
    border: 2px solid #bbf7d0;
  }
  .card-fire {
    background: linear-gradient(135deg, #fca5a5, #dc2626 50%, #f87171);
    border: 2px solid #fecaca;
  }

  .card-inner {
    background: #ffffff;
    color: #0f172a;
    border-radius: 12px;
    height: 100%;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 3px;
  }

  .card-name {
    font-size: 15.5px;
    font-weight: 900;
    color: #0f172a;
  }

  .card-code {
    font-size: 11px;
    color: #64748b;
  }

  .type-badge {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    text-align: center;
    line-height: 22px;
    font-size: 12px;
    font-weight: bold;
    color: white;
  }
  .type-steel { background: #64748b; }
  .type-lightning { background: #eab308; }
  .type-psychic { background: #a855f7; }
  .type-water { background: #0284c7; }
  .type-grass { background: #16a34a; }
  .type-fire { background: #dc2626; }

  .chart-window {
    width: 100%;
    height: 70px;
    background: #0f172a;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    margin: 4px 0;
    position: relative;
    overflow: hidden;
  }

  .chart-header {
    background: rgba(15, 23, 42, 0.85);
    padding: 2px 8px;
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: #94a3b8;
    font-weight: bold;
  }

  .chart-canvas {
    width: 100%;
    height: 48px;
  }

  /* 特性ボックス */
  .ability-box {
    background: #f1f5f9;
    border-left: 4px solid #dc2626;
    padding: 5px 8px;
    border-radius: 4px;
    margin-bottom: 5px;
  }
  .ability-title {
    font-size: 12px;
    font-weight: 900;
    color: #dc2626;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 2px;
  }
  .ability-desc {
    font-size: 10.5px;
    color: #1e293b;
    line-height: 1.35;
    font-weight: 600;
  }

  /* ワザ欄 */
  .attack-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .attack-item {
    border-top: 1.5px solid #e2e8f0;
    padding-top: 4px;
  }
  .attack-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .attack-name {
    font-size: 13px;
    font-weight: 900;
    color: #0f172a;
  }
  .attack-damage {
    font-size: 15.5px;
    font-weight: 900;
    color: #dc2626;
  }
  .attack-desc {
    font-size: 10px;
    color: #475569;
    line-height: 1.25;
    margin-top: 1px;
  }

  .card-footer {
    border-top: 2px solid #e2e8f0;
    padding-top: 4px;
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: #64748b;
    font-weight: bold;
  }

  /* アニメーション */
  .shake {
    animation: shake-anim 0.35s ease-in-out;
  }
  @keyframes shake-anim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px) rotate(-2deg); }
    40%, 80% { transform: translateX(10px) rotate(2deg); }
  }

  .attack-lunge-left {
    animation: lunge-right 0.35s ease-in-out;
  }
  @keyframes lunge-right {
    50% { transform: translateX(35px) scale(1.05); }
  }

  .attack-lunge-right {
    animation: lunge-left 0.35s ease-in-out;
  }
  @keyframes lunge-left {
    50% { transform: translateX(-35px) scale(1.05); }
  }

  .defeated {
    filter: grayscale(1) brightness(0.5);
    transform: translateY(15px) rotate(5deg) !important;
    transition: all 0.5s;
  }

  /* スマホ対応レスポンシブ（768px以下） */
  @media (max-width: 768px) {
    body { padding: 10px 8px; }
    h1 { font-size: 20px; }
    .matchup-bar { padding: 8px 10px; flex-direction: column; gap: 8px; }
    .select-group { width: 100%; }
    select { width: 100%; min-width: unset; font-size: 13px; }
    .btn-random { width: 100%; }
    .arena { padding: 10px 8px; }
    .battle-stage { flex-direction: column-reverse; gap: 10px; }
    .vs-badge { font-size: 22px; margin: -4px 0; }
    .card { width: 100%; max-width: 330px; height: 380px; }
    .hp-bar-container { width: 100%; max-width: 330px; }
    .cutin-banner { min-height: 68px; padding: 6px 10px; }
    .cutin-top { font-size: 17px; }
    .cutin-bottom { font-size: 13.5px; }
    .start-btn { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>東証ポケカ：厳選60社決算バトルスタジアム</h1>
  <p class="subtitle">朝刊ニュースで試合前から大波乱！ リアル連動型決算カードバトル</p>
</header>

<!-- 対戦マッチアップ選択バー -->
<div class="matchup-bar">
  <div class="select-group">
    <label>▼ あなたの企業（PLAYER 1）</label>
    <select id="p1Select" onchange="changeFighter('p1')"></select>
  </div>

  <button class="btn-random" onclick="pickRandomMatchup()">🎲 ランダム対戦</button>

  <div class="select-group">
    <label>▼ 対戦相手の企業（PLAYER 2）</label>
    <select id="p2Select" onchange="changeFighter('p2')"></select>
  </div>
</div>

<!-- バトルアリーナ -->
<div class="arena">

  <!-- 巨大必殺技カットインテロップ（技名＋ダメージ） -->
  <div class="cutin-banner" id="cutinBanner">
    <div class="cutin-top" id="cutinTop">🔔 企業を選んで「開戦！（朝刊ニュース直撃）」を押してください</div>
    <div class="cutin-bottom" id="cutinBottom">開戦と同時に今朝のリアル経済ニュースが両社を直撃します</div>
  </div>
  
  <!-- 操作コントロールパネル（オート／手動送り） -->
  <div class="arena-controls">
    <button class="start-btn" id="startBtn" onclick="startBattle()">
      🔔 開戦！（朝刊ニュース直撃）
    </button>

    <!-- 手動送り＆オート切り替え（戦闘中のみ表示） -->
    <button class="start-btn" id="nextTurnBtn" onclick="stepTurnManual()" style="display:none; background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 11px 28px; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);">
      ⏭ 次のターンへ進む
    </button>

    <button class="ctrl-btn" id="autoToggleBtn" onclick="toggleAutoPlay()" style="display:none;">
      ▶ オート進行: <span id="autoStatusText" style="color:#94a3b8;">OFF (手動)</span>
    </button>

    <button class="start-btn" id="resetBtn" style="background:#334155; display:none;" onclick="resetBattle()">
      もう一度戦う
    </button>
  </div>

  <div class="battle-stage">
    
    <!-- 左：プレイヤー企業 -->
    <div class="fighter-slot">
      <div class="hp-bar-container">
        <div class="hp-bar-header">
          <span id="p1-name-display">企業名</span>
          <span id="p1-hp-text">HP -- / --</span>
        </div>
        <div class="hp-progress">
          <div class="hp-fill" id="p1-hp-bar" style="width: 100%;"></div>
        </div>
      </div>
      <div id="p1-card-slot"></div>
    </div>

    <!-- 中央：VS -->
    <div class="vs-badge">VS</div>

    <!-- 右：対戦相手企業 -->
    <div class="fighter-slot">
      <div class="hp-bar-container">
        <div class="hp-bar-header">
          <span id="p2-name-display">企業名</span>
          <span id="p2-hp-text">HP -- / --</span>
        </div>
        <div class="hp-progress">
          <div class="hp-fill" id="p2-hp-bar" style="width: 100%;"></div>
        </div>
      </div>
      <div id="p2-card-slot"></div>
    </div>

  </div>

  <!-- 実況モニター（履歴） -->
  <div class="log-monitor" id="logMonitor">
    <div class="log-line">🔔 バトルの詳細ログがここに蓄積されます。</div>
  </div>

</div>

let p1 = null;

let battleInterval = null;
let turn = 1;

let isBattleRunning = false;
let isAutoPlay = false; // デフォルトは手動進行
let hasMorningNewsApplied = false;

function initSelects() {
  const s1 = document.getElementById('p1Select');
  const s2 = document.getElementById('p2Select');

  s1.innerHTML = "";
  s2.innerHTML = "";

  CARDS_DATA.forEach((card, idx) => {
    const opt1 = document.createElement('option');
    opt1.value = idx;
    // リクエスト対応：コードを外し「企業名　職種」の順で五十音順表示
    opt1.text = `${card.name}　${card.sector}`;
    s1.appendChild(opt1);

    const opt2 = document.createElement('option');
    opt2.value = idx;
    opt2.text = `${card.name}　${card.sector}`;
    s2.appendChild(opt2);
  });

  // 初期値：武田薬品(4502) vs トヨタ自動車(7203)
  const defaultP1Idx = CARDS_DATA.findIndex(c => c.code === "4502");
  const defaultP2Idx = CARDS_DATA.findIndex(c => c.code === "7203");
  s1.value = defaultP1Idx >= 0 ? defaultP1Idx : 0;
  s2.value = defaultP2Idx >= 0 ? defaultP2Idx : 1;

  changeFighter('p1');
  changeFighter('p2');
}

function renderCardHtml(card) {
  return `
    <div class="card ${card.cardClass}">
      <div class="card-inner">
        <div class="card-header">
          <span class="card-name">${card.name} <span class="card-code">#${card.code}</span></span>
          <span class="type-badge ${card.badgeClass}">${card.type}</span>
        </div>
        <div class="chart-window">
          <div class="chart-header">
            <span>PBR: ${card.pbr}倍</span>
            <span style="color:#22c55e;">配当: ${card.divYield}%</span>
          </div>
          <svg class="chart-canvas" viewBox="0 0 300 90">
            <path d="M 0,60 Q 70,20 140,50 T 300,20" fill="none" stroke="#22c55e" stroke-width="3"/>
          </svg>
        </div>
        <div class="ability-box">
          <div class="ability-title">${card.ability.icon} 特性: ${card.ability.name}</div>
          <div class="ability-desc">${card.ability.desc}</div>
        </div>
        <div class="attack-list">
          <div class="attack-item">
            <div class="attack-top">
              <span class="attack-name">${card.attack1.name}</span>
              <span class="attack-damage">${card.attack1.dmg} dmg</span>
            </div>
            <div class="attack-desc">${card.attack1.desc}</div>
          </div>
          <div class="attack-item">
            <div class="attack-top">
              <span class="attack-name">${card.attack2.name}</span>
              <span class="attack-damage">${card.attack2.dmg} dmg</span>
            </div>
            <div class="attack-desc">${card.attack2.desc}</div>
          </div>
        </div>
        <div class="card-footer">
          <span>業種: ${card.sector}</span>
          <span>初期HP: ${card.maxHp}</span>
        </div>
      </div>
    </div>
  `;
}

function changeFighter(slot) {
  if (battlePhase !== "SELECT") return;
  const select = document.getElementById(slot + 'Select');
  const cardData = JSON.parse(JSON.stringify(CARDS_DATA[select.value]));

  if (slot === 'p1') {
    p1 = cardData;
    p1.currentHp = p1.hp;
    document.getElementById('p1-name-display').innerText = p1.name;
    document.getElementById('p1-card-slot').innerHTML = renderCardHtml(p1);
  } else {
    p2 = cardData;
    p2.currentHp = p2.hp;
    document.getElementById('p2-name-display').innerText = p2.name;
    document.getElementById('p2-card-slot').innerHTML = renderCardHtml(p2);
  }
  hasMorningNewsApplied = false;
  updateHpDisplay();
}

function pickRandomMatchup() {
  if (battlePhase !== "SELECT") return;
  const s1 = document.getElementById('p1Select');
  const s2 = document.getElementById('p2Select');
  const r1 = Math.floor(Math.random() * CARDS_DATA.length);
  let r2 = Math.floor(Math.random() * CARDS_DATA.length);
  while (r1 === r2) {
    r2 = Math.floor(Math.random() * CARDS_DATA.length);
  }
  s1.value = r1;
  s2.value = r2;
  changeFighter('p1');
  changeFighter('p2');
  setCutin(`🎲 ランダム選出！`, `『${p1.name}』 VS 『${p2.name}』！`, "event");
}

function setCutin(topHtml, bottomHtml, type = "normal") {
  const banner = document.getElementById('cutinBanner');
  const topElem = document.getElementById('cutinTop');
  const bottomElem = document.getElementById('cutinBottom');

  topElem.innerHTML = topHtml;
  bottomElem.innerHTML = bottomHtml;

  if (type === "event") {
    banner.style.borderColor = "#f59e0b";
  } else if (type === "damage") {
    banner.style.borderColor = "#ef4444";
  } else if (type === "buff") {
    banner.style.borderColor = "#22c55e";
  } else {
    banner.style.borderColor = "#38bdf8";
  }
}

function addLog(msg, type = "") {
  const monitor = document.getElementById('logMonitor');
  const div = document.createElement('div');
  div.className = "log-line " + type;
  div.innerHTML = msg;
  monitor.prepend(div);
}

function updateHpDisplay() {
  if (!p1 || !p2) return;

  // P1
  const p1Overheal = p1.currentHp > p1.maxHp;
  const p1Pct = Math.max(0, Math.min(100, (p1.currentHp / p1.maxHp) * 100));
  const p1Bar = document.getElementById('p1-hp-bar');
  p1Bar.style.width = p1Pct + "%";
  let p1Text = `HP ${p1.currentHp} / ${p1.maxHp}`;
  if (p1Overheal) {
    p1Bar.classList.remove('danger');
    p1Bar.classList.add('overheal');
    p1Text += ` <span class="hp-overheal-badge">(+${p1.currentHp - p1.maxHp}突破!)</span>`;
  } else {
    p1Bar.classList.remove('overheal');
    if (p1Pct < 30) p1Bar.classList.add('danger');
    else p1Bar.classList.remove('danger');
  }
  document.getElementById('p1-hp-text').innerHTML = p1Text;

  // P2
  const p2Overheal = p2.currentHp > p2.maxHp;
  const p2Pct = Math.max(0, Math.min(100, (p2.currentHp / p2.maxHp) * 100));
  const p2Bar = document.getElementById('p2-hp-bar');
  p2Bar.style.width = p2Pct + "%";
  let p2Text = `HP ${p2.currentHp} / ${p2.maxHp}`;
  if (p2Overheal) {
    p2Bar.classList.remove('danger');
    p2Bar.classList.add('overheal');
    p2Text += ` <span class="hp-overheal-badge">(+${p2.currentHp - p2.maxHp}突破!)</span>`;
  } else {
    p2Bar.classList.remove('overheal');
    if (p2Pct < 30) p2Bar.classList.add('danger');
    else p2Bar.classList.remove('danger');
  }
  document.getElementById('p2-hp-text').innerHTML = p2Text;
}

// 【試合前フェーズ】朝刊ニュース一斉適用（気配値チェック）
function applyMorningNews() {
  hasMorningNewsApplied = true;

  let newsAppliedCount = 0;
  let summaryRows = [];

  const morningPool = TODAY_EVENTS.filter(ev => ev.timing === "MORNING" || ev.timing === "BOTH");
  morningPool.forEach(ev => {
    [p1, p2].forEach(p => {
      let isTarget = false;
      if (ev.targetScope === "ALL") isTarget = true;
      if (ev.targetSectors && ev.targetSectors.includes(p.sector)) isTarget = true;
      if (ev.targetCodes && ev.targetCodes.includes(p.code)) isTarget = true;

      if (isTarget) {
        newsAppliedCount++;
        if (ev.effectType === "DAMAGE" || ev.effectType === "DAMAGE_AND_BREAK") {
          p.currentHp = Math.max(10, p.currentHp - ev.value); // 戦前なので最低10残す
          summaryRows.push({
            type: "damage",
            html: `💥 【${ev.newsTitle}】により『${p.name}』に <span class="dmg-highlight">-${ev.value} dmg</span> 直撃！`,
            log: `💥 【${ev.newsTitle}】により『${p.name}』に -${ev.value} dmg！ （${ev.reason}）`
          });
        } else if (ev.effectType === "HEAL") {
          // ★リクエスト対応：HPマックスを超えて上限突破加算！
          p.currentHp = p.currentHp + ev.value;
          const overhealBadge = p.currentHp > p.maxHp ? ` (+${p.currentHp - p.maxHp}突破!)` : "";
          summaryRows.push({
            type: "buff",
            html: `💖 【${ev.newsTitle}】により『${p.name}』が <span class="buff-highlight">+${ev.value} HP上限突破！</span>${overhealBadge}`,
            log: `💖 【${ev.newsTitle}】により『${p.name}』が +${ev.value} HP上限突破！ （${ev.reason}）`
          });
        } else if (ev.effectType === "BUFF_ATK") {
          p.attack1.dmg = Math.floor(p.attack1.dmg * ev.value);
          p.attack2.dmg = Math.floor(p.attack2.dmg * ev.value);
          summaryRows.push({
            type: "buff",
            html: `🛡️ 【${ev.newsTitle}】により『${p.name}』の攻撃力が <span class="buff-highlight">2倍に覚醒！</span>`,
            log: `🛡️ 【${ev.newsTitle}】により『${p.name}』の攻撃力が2倍に覚醒！ （${ev.reason}）`
          });
        }
      }
    });
  });

  updateHpDisplay();

  // カード振動
  const c1 = document.querySelector('#p1-card-slot .card');
  const c2 = document.querySelector('#p2-card-slot .card');
  if (c1) { c1.classList.add('shake'); setTimeout(() => c1.classList.remove('shake'), 400); }
  if (c2) { c2.classList.add('shake'); setTimeout(() => c2.classList.remove('shake'), 400); }

  if (summaryRows.length > 0) {
    // 各ニュースを改行して見やすく配置
    const newsListHtml = `
      <div class="cutin-news-list">
        ${summaryRows.map(row => `<div class="cutin-news-row ${row.type}-row">${row.html}</div>`).join('')}
      </div>
    `;
    const guideHtml = `<div style="margin-top:6px; font-size:13px; color:#38bdf8; font-weight:bold;">👉 ニュースを確認したら、下の「⏭ 市場オープン（開戦）へ進む」を押してください</div>`;
    setCutin(
      `📰 【朝刊ニュース直撃！】開戦前気配値が確定！`,
      newsListHtml + guideHtml,
      "damage"
    );
    summaryRows.forEach(item => addLog(item.log, "log-event"));
  } else {
    setCutin(
      `📰 【朝刊ニュースチェック完了】今朝のニュースは両社に無風！`,
      `対戦両社ともに通常HPで市場オープンを迎えます。<div style="margin-top:6px; font-size:13px; color:#38bdf8; font-weight:bold;">👉 下の「⏭ 市場オープン（開戦）へ進む」を押してください</div>`,
      "event"
    );
    addLog("📰 【朝刊ニュースチェック】今朝のニュースは対戦両社に直接の影響はありませんでした。", "log-event");
  }
}

// バトル開始（開戦ボタン押下時：朝刊ニュース直撃フェーズ）
function startBattle() {
  if (battlePhase !== "SELECT") return;

  battlePhase = "MORNING_NEWS";
  document.getElementById('p1Select').disabled = true;
  document.getElementById('p2Select').disabled = true;

  document.getElementById('startBtn').style.display = 'none';

  // 次のステップボタンとオートボタンを表示
  const nextBtn = document.getElementById('nextTurnBtn');
  nextBtn.innerText = "⏭ 市場オープン（開戦）へ進む";
  nextBtn.style.display = 'inline-flex';
  document.getElementById('autoToggleBtn').style.display = 'inline-flex';

  p1.cardElem = document.querySelector('#p1-card-slot .card');
  p2.cardElem = document.querySelector('#p2-card-slot .card');
  p1.cardElem.classList.remove('defeated');
  p2.cardElem.classList.remove('defeated');

  // ステップ1：朝刊ニュース直撃（手動待機なので自動タイマーなし！）
  applyMorningNews();

  // オートがONの場合のみ自動で次へ
  if (isAutoPlay) {
    battleInterval = setInterval(advanceBattleStep, 2600);
  }
}

// ユーザーが手動で1ステップ進める（朝刊直撃読了 → 市場オープン → ターン1 → ターン2...）
function stepTurnManual() {
  // 手動で押されたらオートタイマーを止めて手動優先
  if (battleInterval) {
    clearInterval(battleInterval);
    battleInterval = null;
    isAutoPlay = false;
    const statusElem = document.getElementById('autoStatusText');
    if (statusElem) {
      statusElem.innerText = "OFF (手動)";
      statusElem.style.color = "#94a3b8";
    }
    const btn = document.getElementById('autoToggleBtn');
    if (btn) btn.classList.remove('active');
  }

  advanceBattleStep();
}

// 手動・オート共通の進行ステップ関数
function advanceBattleStep() {
  if (battlePhase === "MORNING_NEWS") {
    // 朝刊ニュース読み終わり → 市場オープンへ進む
    proceedMarketOpen();
  } else if (battlePhase === "MARKET_OPEN") {
    // 市場オープンテロップ読み終わり → 第1ターン開始
    battlePhase = "FIGHTING";
    isBattleRunning = true;
    document.getElementById('nextTurnBtn').innerText = "⏭ 次のターンへ進む";
    processTurn();
  } else if (battlePhase === "FIGHTING") {
    // 通常のターン進行
    processTurn();
  }
}

// 市場オープン演出
function proceedMarketOpen() {
  battlePhase = "MARKET_OPEN";
  document.getElementById('nextTurnBtn').innerText = "⏭ 第1ターンを開始する";

  const openMsg = `🚨 【前場寄り付き】市場オープン！ 『${p1.name}』 vs 『${p2.name}』！ 朝刊の波乱を背負って開戦！`;
  setCutin(
    "🚨 市場オープン！ 東証の鐘が鳴り響く！",
    `『${p1.name}』 vs 『${p2.name}』！ <div style="margin-top:5px; font-size:13px; color:#38bdf8; font-weight:bold;">👉 「第1ターンを開始する」を押してください！</div>`,
    "event"
  );
  addLog(openMsg, "log-event");
}

// オート／手動の切り替え
function toggleAutoPlay() {
  isAutoPlay = !isAutoPlay;
  const statusElem = document.getElementById('autoStatusText');
  const btn = document.getElementById('autoToggleBtn');

  if (isAutoPlay) {
    statusElem.innerText = "ON (自動)";
    statusElem.style.color = "#22c55e";
    btn.classList.add('active');
    if (!battleInterval && battlePhase !== "SELECT" && battlePhase !== "ENDED") {
      advanceBattleStep(); // すぐに1ステップ進めてからオート開始
      battleInterval = setInterval(advanceBattleStep, 2600);
    }
  } else {
    statusElem.innerText = "OFF (手動)";
    statusElem.style.color = "#94a3b8";
    btn.classList.remove('active');
    if (battleInterval) {
      clearInterval(battleInterval);
      battleInterval = null;
    }
  }
}

function processTurn() {
  if (p1.currentHp <= 0 || p2.currentHp <= 0) {
    endBattle();
    return;
  }

  // ターン3：突発ニュース乱入（対戦カード関連ニュース限定フィルター）
  if (turn === 3) {
    const intradayPool = TODAY_EVENTS.filter(ev => ev.timing === "INTRADAY" || ev.timing === "BOTH");
    
    // 対戦中の2社（p1 または p2）の個別銘柄コードまたは業種に該当するニュースを最優先抽出
    let matchedEvents = intradayPool.filter(ev => {
      if (ev.targetScope === "ALL") return true;
      const p1Hit = (ev.targetSectors && ev.targetSectors.includes(p1.sector)) || (ev.targetCodes && ev.targetCodes.includes(p1.code));
      const p2Hit = (ev.targetSectors && ev.targetSectors.includes(p2.sector)) || (ev.targetCodes && ev.targetCodes.includes(p2.code));
      return p1Hit || p2Hit;
    });

    // 該当ニュースがなければ全体（ALL）マクロニュースへフォールバック
    if (matchedEvents.length === 0) {
      matchedEvents = intradayPool.filter(ev => ev.targetScope === "ALL");
      if (matchedEvents.length === 0) matchedEvents = intradayPool;
    }

    const ev = matchedEvents[Math.floor(Math.random() * matchedEvents.length)];
    setCutin(ev.cutinTop, ev.cutinBottom, "event");
    addLog(`📰 【場中速報】${ev.newsTitle}（${ev.reason}）`, "log-event");

    [p1, p2].forEach(p => {
      let isTarget = false;
      if (ev.targetScope === "ALL") isTarget = true;
      if (ev.targetSectors && ev.targetSectors.includes(p.sector)) isTarget = true;
      if (ev.targetCodes && ev.targetCodes.includes(p.code)) isTarget = true;

      if (isTarget) {
        if (ev.effectType === "DAMAGE" || ev.effectType === "DAMAGE_AND_BREAK") {
          if (p.code !== "7974") {
            p.currentHp = Math.max(0, p.currentHp - ev.value);
            p.cardElem.classList.add('shake');
            setTimeout(() => p.cardElem.classList.remove('shake'), 400);
            addLog(`💥 【場中直撃】『${p.name}』に -${ev.value} dmg！`, "log-damage");
          } else {
            addLog(`🛡️ 『任天堂』は「無借金経営の絶対防壁」で場中ダメージを無効化した！`, "log-buff");
          }
        } else if (ev.effectType === "HEAL") {
          p.currentHp = p.currentHp + ev.value; // HPマックスを超えて上限突破
          const overhealBadge = p.currentHp > p.maxHp ? ` (+${p.currentHp - p.maxHp}突破!)` : "";
          addLog(`💖 【場中追い風】『${p.name}』が +${ev.value} HP上限突破！${overhealBadge}`, "log-buff");
        } else if (ev.effectType === "BUFF_ATK") {
          p.attack1.dmg = Math.floor(p.attack1.dmg * ev.value);
          p.attack2.dmg = Math.floor(p.attack2.dmg * ev.value);
          addLog(`⚔️ 【場中覚醒】『${p.name}』の攻撃力が ${ev.value}倍にパワーアップ！`, "log-buff");
        }
      }
    });

    updateHpDisplay();
    turn++;
    if (p1.currentHp <= 0 || p2.currentHp <= 0) endBattle();
    return;
  }

  const isP1Turn = (turn % 2 === 1);
  const attacker = isP1Turn ? p1 : p2;
  const defender = isP1Turn ? p2 : p1;
  const lungeClass = isP1Turn ? 'attack-lunge-left' : 'attack-lunge-right';

  // 突進演出
  attacker.cardElem.classList.add(lungeClass);
  setTimeout(() => attacker.cardElem.classList.remove(lungeClass), 400);

  // ★市場ボラティリティシステム（ターン経過による相場過熱メカニクス）
  let marketMultiplier = 1.0;
  let marketPhaseName = "前場";
  if (turn >= 9) {
    marketMultiplier = 2.0;
    marketPhaseName = "大引け直前・乱高下";
  } else if (turn >= 5) {
    marketMultiplier = 1.5;
    marketPhaseName = "後場・出来高急増";
  }

  // フェーズ移行ターンでのアナウンス
  if (turn === 5) {
    addLog("📈 【後場突入】市場の出来高が急増！ ボラティリティ上昇により全ダメージが1.5倍に激化！", "log-buff");
  } else if (turn === 9) {
    addLog("🔥 【大引け直前】相場過熱クライマックス！ 乱高下モードにより全ダメージが2.0倍へ跳ね上がる！", "log-damage");
  }

  // ワザ選択
  const useSkill2 = (Math.random() > 0.45);
  const atk = useSkill2 ? attacker.attack2 : attacker.attack1;
  let dmg = atk.dmg;
  let notes = [];

  // コメダの逆写真詐欺特性（+35）
  if (attacker.ability.name.includes("逆写真詐欺")) {
    dmg += 35;
    notes.push("デカ盛り+35");
  }

  // 特殊ギャンブル技
  let isGambleFail = false;
  if (dmg >= 900) {
    const success = (Math.random() < 0.35);
    if (success) {
      dmg = 9999;
      notes.push("奇跡の超特大打点！");
    } else {
      dmg = 0;
      isGambleFail = true;
      attacker.currentHp = Math.max(0, attacker.currentHp - 80);
      setCutin(`💥 『${attacker.name}』の『${atk.name}』失敗！`, `ミッション失敗で自爆！ <span class="dmg-highlight">-80 自傷dmg</span>`, "damage");
      addLog(`💥 『${attacker.name}』の『${atk.name}』失敗！ 自爆して80自傷ダメージ！`);
    }
  }

  if (!isGambleFail) {
    // 市場ボラティリティ倍率の適用
    if (marketMultiplier > 1.0) {
      dmg = Math.floor(dmg * marketMultiplier);
      notes.push(`${marketPhaseName} x${marketMultiplier}`);
    }

    // 防御特性計算
    if (dmg > 0 && defender.ability.name.includes("割安装甲")) {
      dmg = Math.max(10, dmg - 30);
      notes.push("割安装甲-30");
    }

    // ニトリの円高防御
    if (defender.code === "9843" && turn >= 4) {
      dmg = Math.floor(dmg * 0.7);
      notes.push("ニトリ円高防御");
    }

    // 被弾処理
    defender.currentHp = Math.max(0, defender.currentHp - dmg);
    defender.cardElem.classList.add('shake');
    setTimeout(() => defender.cardElem.classList.remove('shake'), 400);

    const noteStr = notes.length > 0 ? `<span class="note-highlight">(${notes.join(", ")})</span>` : "";
    
    setCutin(
      `⚔️ ${attacker.name}：『${atk.name}』炸裂！！`,
      `💥 ${defender.name}に <span class="dmg-highlight">${dmg}</span> ダメージ！！${noteStr}`,
      "damage"
    );

    const logStr = `⚔️ [T${turn}] ${attacker.name}：『${atk.name}』！ ${defender.name}に <span class="log-damage">${dmg}</span> dmg！ ${notes.length > 0 ? '(' + notes.join(', ') + ')' : ''}`;
    addLog(logStr);
  }

  // リジェネ特性（JT、武田薬品、KDDIなど）
  if (attacker.ability.desc.includes("回復") || attacker.ability.name.includes("リジェネ")) {
    const healVal = attacker.code === "4502" ? 40 : 60; // 武田薬品は40、他は60
    attacker.currentHp = Math.min(attacker.maxHp, attacker.currentHp + healVal);
    addLog(`💖 ${attacker.name}の特性『${attacker.ability.name}』発動！ HP${healVal}回復！`, "log-buff");
  }

  updateHpDisplay();

  if (p1.currentHp <= 0 || p2.currentHp <= 0) {
    endBattle();
    return;
  }

  turn++;
}

function endBattle() {
  if (battleInterval) {
    clearInterval(battleInterval);
    battleInterval = null;
  }
  battlePhase = "ENDED";
  isBattleRunning = false;

  document.getElementById('nextTurnBtn').style.display = 'none';
  document.getElementById('autoToggleBtn').style.display = 'none';

  if (p1.currentHp <= 0) {
    p1.cardElem.classList.add('defeated');
    setCutin(
      `🏆 【大引け】${p1.name}が上場廃止（KO）！！`,
      `『${p2.name}』が圧倒的資本力で市場を完全制覇！！`,
      "event"
    );
    addLog(`🏆 【大引け】${p1.name}が上場廃止！ 『${p2.name}』の完全勝利！！`, "log-buff");
  } else {
    p2.cardElem.classList.add('defeated');
    setCutin(
      `🏆 【大引け】${p2.name}が買収（KO）完了！！`,
      `『${p1.name}』が市場の勝者として君臨！！`,
      "event"
    );
    addLog(`🏆 【大引け】${p2.name}が買収（KO）された！ 『${p1.name}』の勝利！！`, "log-buff");
  }

  document.getElementById('resetBtn').style.display = 'inline-block';
}

function resetBattle() {
  p1.currentHp = p1.maxHp;
  p2.currentHp = p2.maxHp;
  turn = 1;
  battlePhase = "SELECT";
  hasMorningNewsApplied = false;
  isBattleRunning = false;
  isAutoPlay = false;
  p1.cardElem.classList.remove('defeated', 'shake');
  p2.cardElem.classList.remove('defeated', 'shake');
  updateHpDisplay();

  const statusElem = document.getElementById('autoStatusText');
  if (statusElem) {
    statusElem.innerText = "OFF (手動)";
    statusElem.style.color = "#94a3b8";
  }
  const autoBtn = document.getElementById('autoToggleBtn');
  if (autoBtn) autoBtn.classList.remove('active');

  setCutin("🔔 企業を選んで「開戦！（朝刊ニュース直撃）」を押してください", "開戦と同時に今朝のリアル経済ニュースが両社を直撃します", "normal");
  document.getElementById('logMonitor').innerHTML = '<div class="log-line">🔔 バトルの詳細ログがここに蓄積されます。</div>';
  document.getElementById('startBtn').style.display = 'inline-block';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').innerText = "🔔 開戦！（朝刊ニュース直撃）";
  document.getElementById('nextTurnBtn').style.display = 'none';
  document.getElementById('autoToggleBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('p1Select').disabled = false;
  document.getElementById('p2Select').disabled = false;
}

window.onload = initSelects;
</script>
